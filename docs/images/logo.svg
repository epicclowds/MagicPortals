<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="sky" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#2a1d5c"/>
      <stop offset="0.55" stop-color="#141436"/>
      <stop offset="1" stop-color="#07081a"/>
    </radialGradient>
    <linearGradient id="world" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="0.48" stop-color="#8fcdf5"/>
      <stop offset="0.5" stop-color="#6fbf5a"/>
      <stop offset="1" stop-color="#3f8f3a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffd35a"/>
      <stop offset="0.3" stop-color="#ff4df2"/>
      <stop offset="0.65" stop-color="#40d9ff"/>
      <stop offset="1" stop-color="#ff4df2"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-30%" width="220%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft" x="-60%" y="-30%" width="220%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <clipPath id="rift">
      <polygon id="form" points="128,22 141,50 133,70 153,95 145,118 167,142 150,167 157,190 139,213 128,236 119,212 107,187 114,162 92,138 106,112 97,88 114,64 110,44"/>
    </clipPath>
  </defs>

  <rect width="256" height="256" rx="44" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="40" cy="46" r="1.6" opacity=".9"/><circle cx="66" cy="96" r="1.1" opacity=".7"/>
    <circle cx="208" cy="58" r="1.8" opacity=".9"/><circle cx="196" cy="150" r="1.2" opacity=".6"/>
    <circle cx="52" cy="186" r="1.3" opacity=".7"/><circle cx="216" cy="206" r="1.5" opacity=".8"/>
    <circle cx="84" cy="30" r="1" opacity=".6"/><circle cx="176" cy="30" r="1.1" opacity=".7"/>
    <circle cx="30" cy="132" r="1.1" opacity=".6"/><circle cx="228" cy="110" r="1" opacity=".6"/>
  </g>

  <!-- outer glow -->
  <use href="#form" fill="none" stroke="url(#edge)" stroke-width="16" filter="url(#glow)" opacity=".85"/>

  <!-- the destination world inside the rift -->
  <g clip-path="url(#rift)">
    <rect x="80" y="20" width="96" height="220" fill="url(#world)"/>
    <rect x="80" y="20" width="96" height="140" fill="#a9dcff"/>
    <polygon points="80,160 100,150 118,156 138,146 176,154 176,240 80,240" fill="#5fb24f"/>
    <rect x="133" y="122" width="8" height="28" fill="#6b4a2b"/>
    <rect x="120" y="104" width="34" height="22" fill="#2f7d33"/>
    <rect x="126" y="96" width="22" height="10" fill="#3a8c3c"/>
    <rect x="80" y="184" width="96" height="60" fill="#3f8f3a" opacity=".6"/>
    <rect x="98" y="46" width="22" height="7" fill="#ffffff" opacity=".85"/>
    <rect x="110" y="41" width="18" height="6" fill="#ffffff" opacity=".85"/>
  </g>

  <!-- bright edge -->
  <use href="#form" fill="none" stroke="url(#edge)" stroke-width="5" filter="url(#soft)"/>
  <use href="#form" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="miter" opacity=".95"/>

  <!-- lightning arcs -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="166,142 182,134 178,124 196,116" stroke="#ff4df2" stroke-width="3" filter="url(#soft)"/>
    <polyline points="166,142 182,134 178,124 196,116" stroke="#ffffff" stroke-width="1.2"/>
    <polyline points="92,138 76,146 82,156 64,166" stroke="#40d9ff" stroke-width="3" filter="url(#soft)"/>
    <polyline points="92,138 76,146 82,156 64,166" stroke="#ffffff" stroke-width="1.2"/>
    <polyline points="141,50 156,40 152,30" stroke="#ffd35a" stroke-width="2.6" filter="url(#soft)"/>
    <polyline points="141,50 156,40 152,30" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffffff">
    <path d="M190 84 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" opacity=".9"/>
    <path d="M70 72 l1.5 4.5 4.5 1.5 -4.5 1.5 -1.5 4.5 -1.5 -4.5 -4.5 -1.5 4.5 -1.5z" opacity=".8"/>
    <path d="M180 196 l1.3 4 4 1.3 -4 1.3 -1.3 4 -1.3 -4 -4 -1.3 4 -1.3z" opacity=".75"/>
  </g>
</svg>
