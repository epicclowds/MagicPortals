<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a36"/>
      <stop offset="1" stop-color="#0c0f22"/>
    </linearGradient>
    <linearGradient id="rand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#40d9ff"/>
      <stop offset="1" stop-color="#ff4df2"/>
    </linearGradient>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fb3ff"/>
    </marker>
  </defs>

  <rect width="960" height="470" rx="18" fill="url(#bg)"/>
  <text x="32" y="44" fill="#ffffff" font-size="22" font-weight="700">How MagicPortals works</text>
  <text x="32" y="68" fill="#9fb3ff" font-size="14">The view through a portal is rendered on the client by a resource-pack shader – no fake blocks, no lag.</text>

  <!-- boxes -->
  <g font-size="13.5" fill="#dfe6ff">
    <rect x="32" y="96" width="196" height="176" rx="12" fill="#1d2450" stroke="url(#rand)" stroke-width="2"/>
    <text x="48" y="124" fill="#ffffff" font-size="16" font-weight="700">1 · Every server</text>
    <text x="48" y="152">Snapshots the blocks in</text>
    <text x="48" y="170">front of and behind each</text>
    <text x="48" y="188">portal once a minute.</text>
    <text x="48" y="220" fill="#9fb3ff">Heartbeat every 5 s,</text>
    <text x="48" y="238" fill="#9fb3ff">arrivals on teleport.</text>

    <rect x="268" y="96" width="196" height="176" rx="12" fill="#1d2450" stroke="url(#rand)" stroke-width="2"/>
    <text x="284" y="124" fill="#ffffff" font-size="16" font-weight="700">2 · Exchange</text>
    <text x="284" y="152">MySQL / MariaDB</text>
    <text x="284" y="170">or a shared folder.</text>
    <text x="284" y="202" fill="#9fb3ff">Snapshots are gzipped</text>
    <text x="284" y="220" fill="#9fb3ff">(~10–50 KB) and only</text>
    <text x="284" y="238" fill="#9fb3ff">written when changed.</text>

    <rect x="504" y="96" width="196" height="176" rx="12" fill="#1d2450" stroke="url(#rand)" stroke-width="2"/>
    <text x="520" y="124" fill="#ffffff" font-size="16" font-weight="700">3 · Pack server</text>
    <text x="520" y="152">/magicportals update</text>
    <text x="520" y="170">bakes all snapshots into</text>
    <text x="520" y="188">voxel textures + shaders.</text>
    <text x="520" y="220" fill="#9fb3ff">Delivered via Oraxen,</text>
    <text x="520" y="238" fill="#9fb3ff">ItemsAdder or built-in</text>
    <text x="520" y="256" fill="#9fb3ff">web server.</text>

    <rect x="740" y="96" width="188" height="176" rx="12" fill="#1d2450" stroke="url(#rand)" stroke-width="2"/>
    <text x="756" y="124" fill="#ffffff" font-size="16" font-weight="700">4 · Player</text>
    <text x="756" y="152">A tiny glowing marker</text>
    <text x="756" y="170">passes the camera to a</text>
    <text x="756" y="188">post shader, which</text>
    <text x="756" y="206">raymarches the scene</text>
    <text x="756" y="224">inside the opening.</text>
    <text x="756" y="256" fill="#9fb3ff">Real 3D, parallax, fog.</text>
  </g>

  <g stroke="#9fb3ff" stroke-width="2" fill="none" marker-end="url(#pfeil)">
    <line x1="230" y1="184" x2="264" y2="184"/>
    <line x1="466" y1="184" x2="500" y2="184"/>
    <line x1="702" y1="184" x2="736" y2="184"/>
  </g>

  <!-- walking through -->
  <rect x="32" y="304" width="896" height="134" rx="12" fill="#161c40" stroke="#2c3670"/>
  <text x="48" y="332" fill="#ffffff" font-size="16" font-weight="700">Walking through</text>
  <g font-size="13.5" fill="#dfe6ff">
    <rect x="48" y="350" width="190" height="66" rx="10" fill="#222a5c"/>
    <text x="62" y="378">Player walks into the</text>
    <text x="62" y="396">opening on server A</text>
    <rect x="270" y="350" width="190" height="66" rx="10" fill="#222a5c"/>
    <text x="284" y="378">Arrival is stored in</text>
    <text x="284" y="396">the exchange</text>
    <rect x="492" y="350" width="190" height="66" rx="10" fill="#222a5c"/>
    <text x="506" y="378">Velocity connects the</text>
    <text x="506" y="396">player to server B</text>
    <rect x="714" y="350" width="198" height="66" rx="10" fill="#222a5c"/>
    <text x="728" y="378">B spawns the player in</text>
    <text x="728" y="396">front of its portal to A</text>
  </g>
  <g stroke="#9fb3ff" stroke-width="2" fill="none" marker-end="url(#pfeil)">
    <line x1="240" y1="383" x2="266" y2="383"/>
    <line x1="462" y1="383" x2="488" y2="383"/>
    <line x1="684" y1="383" x2="710" y2="383"/>
  </g>
</svg>
